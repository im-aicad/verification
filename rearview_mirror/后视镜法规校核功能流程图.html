<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后视镜法规校核功能流程图</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 20px;
      background: #eef2f7;
      color: #0f172a;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    .page {
      max-width: 1500px;
      margin: 0 auto;
    }
    header {
      background: #ffffff;
      border: 1px solid #dbe3ef;
      border-radius: 10px;
      padding: 22px 26px;
      margin-bottom: 18px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      line-height: 1.3;
    }
    .meta {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      color: #475569;
      font-size: 14px;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 0 0 18px;
    }
    button {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #1e293b;
      border-radius: 8px;
      padding: 9px 14px;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    button.primary {
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }
    button:hover { filter: brightness(0.97); }
    .diagram-wrap {
      background: #ffffff;
      border: 1px solid #dbe3ef;
      border-radius: 10px;
      padding: 28px;
      overflow: auto;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }
    #diagram {
      min-width: 1180px;
      display: flex;
      justify-content: center;
    }
    #diagram svg {
      max-width: 100%;
      height: auto;
    }
    .note {
      margin-top: 18px;
      background: #ffffff;
      border: 1px solid #dbe3ef;
      border-radius: 10px;
      padding: 18px 22px;
      color: #334155;
      line-height: 1.75;
      font-size: 14px;
    }
    @media print {
      body { background: #ffffff; padding: 0; }
      header, .toolbar, .note { display: none; }
      .diagram-wrap { border: none; box-shadow: none; padding: 0; }
      #diagram { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>后视镜法规校核功能流程图</h1>
      <div class="meta">
        <span>项目: rearview_mirror</span>
        <span>流程: CATPart 上传到 CATIA 校核报告输出</span>
        <span>格式: Mermaid Flowchart</span>
      </div>
    </header>

    <div class="toolbar">
      <button class="primary" onclick="downloadSVG()">下载 SVG</button>
      <button onclick="downloadPNG()">下载 PNG</button>
      <button onclick="window.print()">导出 PDF</button>
    </div>

    <main class="diagram-wrap">
      <div id="diagram"></div>
    </main>

    <section class="note">
      该流程图按当前真实实现整理，覆盖本地 Web 工作台、FastAPI 服务端、独立 Worker、CATIA COM 自动化、输入检查、镜片偏转搜索、间隙校核、标注截图和报告输出。
    </section>
  </div>

  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: "base",
      themeVariables: {
        background: "#ffffff",
        primaryColor: "#f8fafc",
        primaryTextColor: "#0f172a",
        primaryBorderColor: "#cbd5e1",
        lineColor: "#64748b",
        fontFamily: "Microsoft YaHei, PingFang SC, Arial, sans-serif",
        fontSize: "14px"
      },
      flowchart: {
        useMaxWidth: true,
        htmlLabels: true,
        curve: "basis",
        padding: 12
      },
      securityLevel: "loose"
    });

    const diagram = String.raw`flowchart TD
  Start([开始])
  End([完成])
  Fail([流程终止])

  subgraph UI["本地 Web 工作台"]
    direction TB
    U1[打开浏览器工作台]
    U2[检测 CATIA 状态]
    U3{CATIA 已打开?}
    U4[点击打开 CATIA]
    U5{启动或连接成功?}
    U6[选择后视镜 CATPart]
    U7{文件后缀为 .CATPart?}
    U8[填写或确认参数设置]
    U9[提交 /verify]
    U10[WebSocket 展示 16 步状态与日志]
    U11[下载结果或保存到版本库]
  end

  subgraph Server["FastAPI 服务端"]
    direction TB
    S1[接收上传文件与参数]
    S2{检测流程正在运行?}
    S3[保存上传文件到 uploads]
    S4[写入临时配置 JSON]
    S5[启动独立 Worker 子进程]
    S6[接收 Worker JSON 结果]
    S7{结果文件和报告存在?}
    S8[返回下载链接与状态]
    S9[记录错误并推送失败日志]
  end

  subgraph Worker["CATIA Worker 与算法"]
    direction TB
    W1[初始化 COM 并连接 CATIA]
    W2[打开上传的 CATPart]
    W3[读取输入参数几何图形集]
    W4[检查镜片/眼点/地面/车宽线]
    W5{输入检查通过?}
    W6[确认车辆方向]
    W7[创建参数化后视镜]
    W8[隐藏过程辅助特征]
    W9[创建左右法规点和法规线]
    W10[创建临时反射点]
    W11[搜索左右镜片水平/竖直偏转角]
    W12{搜索满足 3mm 间隙?}
    W13[记录最优偏转结果]
    W14[回退 0 度姿态并记录未通过]
    W15[创建正式法规反射点]
    W16[生成三角线框和最佳视野线框]
    W17[测量反射点到镜片边界距离]
    W18[执行二次校核]
    W19[截取法规视野截图]
    W20[另存结果 CATPart]
    W21[创建距离标注 CATPart/CATProduct]
    W22[截取左右后视镜截图]
    W23[保存标注装配]
    W24[生成 Word 报告和 JSON 结果]
  end

  subgraph Output["结果交付"]
    direction TB
    O1[结果 CATPart]
    O2[距离标注 CATPart]
    O3[标注 CATProduct]
    O4[法规视野截图]
    O5[左右后视镜截图]
    O6[Word 报告]
    O7[JSON 结果]
  end

  Start --> U1 --> U2 --> U3
  U3 -- 是 --> U6
  U3 -- 否 --> U4 --> U5
  U5 -- 否 --> S9 --> Fail
  U5 -- 是 --> U6
  U6 --> U7
  U7 -- 否 --> S9 --> Fail
  U7 -- 是 --> U8 --> U9 --> S1

  S1 --> S2
  S2 -- 是 --> S9 --> Fail
  S2 -- 否 --> S3 --> S4 --> S5 --> W1
  U10 -.实时日志.-> S5

  W1 --> W2 --> W3 --> W4 --> W5
  W5 -- 否 --> S9 --> Fail
  W5 -- 是 --> W6 --> W7 --> W8 --> W9 --> W10 --> W11 --> W12
  W12 -- 是 --> W13 --> W15
  W12 -- 否 --> W14 --> W15
  W15 --> W16 --> W17 --> W18 --> W19 --> W20 --> W21 --> W22 --> W23 --> W24 --> S6

  W20 --> O1
  W21 --> O2
  W23 --> O3
  W19 --> O4
  W22 --> O5
  W24 --> O6
  W24 --> O7

  S6 --> S7
  S7 -- 否 --> S9 --> Fail
  S7 -- 是 --> S8 --> U11 --> End

  classDef startEnd fill:#DCFCE7,stroke:#16A34A,stroke-width:1.5px,color:#14532D
  classDef fail fill:#FEE2E2,stroke:#DC2626,stroke-width:1.5px,color:#7F1D1D
  classDef ui fill:#DBEAFE,stroke:#2563EB,stroke-width:1.3px,color:#1E3A8A
  classDef server fill:#CCFBF1,stroke:#0D9488,stroke-width:1.3px,color:#134E4A
  classDef worker fill:#FCE7F3,stroke:#DB2777,stroke-width:1.3px,color:#831843
  classDef output fill:#F1F5F9,stroke:#64748B,stroke-width:1.3px,color:#334155
  classDef decision fill:#FEF3C7,stroke:#D97706,stroke-width:1.5px,color:#78350F

  class Start,End startEnd
  class Fail fail
  class U1,U2,U4,U6,U8,U9,U10,U11 ui
  class S1,S3,S4,S5,S6,S8,S9 server
  class W1,W2,W3,W4,W6,W7,W8,W9,W10,W11,W13,W14,W15,W16,W17,W18,W19,W20,W21,W22,W23,W24 worker
  class O1,O2,O3,O4,O5,O6,O7 output
  class U3,U5,U7,S2,W5,W12,S7 decision`;

    async function renderDiagram() {
      try {
        const result = await mermaid.render("rearview-flowchart", diagram);
        document.getElementById("diagram").innerHTML = result.svg;
      } catch (error) {
        document.getElementById("diagram").innerHTML = "<p style='color:#dc2626'>流程图渲染失败: " + error.message + "</p>";
      }
    }

    function getSVGElement() {
      return document.querySelector("#diagram svg");
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      document.body.removeChild(anchor);
      URL.revokeObjectURL(url);
    }

    function downloadSVG() {
      const svg = getSVGElement();
      if (!svg) return;
      const clone = svg.cloneNode(true);
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      downloadBlob(
        new Blob(['<?xml version="1.0" encoding="UTF-8"?>', clone.outerHTML], { type: "image/svg+xml" }),
        "后视镜法规校核功能流程图.svg"
      );
    }

    function downloadPNG() {
      const svg = getSVGElement();
      if (!svg) return;
      const clone = svg.cloneNode(true);
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      const serialized = new XMLSerializer().serializeToString(clone);
      const bounds = svg.getBoundingClientRect();
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.ceil(bounds.width * 2));
      canvas.height = Math.max(1, Math.ceil(bounds.height * 2));
      const ctx = canvas.getContext("2d");
      ctx.scale(2, 2);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const image = new Image();
      const url = URL.createObjectURL(new Blob(['<?xml version="1.0" encoding="UTF-8"?>', serialized], { type: "image/svg+xml" }));
      image.onload = function () {
        ctx.drawImage(image, 0, 0);
        URL.revokeObjectURL(url);
        canvas.toBlob(function (blob) {
          if (blob) downloadBlob(blob, "后视镜法规校核功能流程图.png");
        });
      };
      image.src = url;
    }

    renderDiagram();
  </script>
</body>
</html>
