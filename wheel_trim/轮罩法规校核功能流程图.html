<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轮罩法规校核功能流程图</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 20px;
      background: #eef2f7;
      color: #0f172a;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    .page {
      max-width: 1500px;
      margin: 0 auto;
    }
    header {
      background: #ffffff;
      border: 1px solid #dbe3ef;
      border-radius: 10px;
      padding: 22px 26px;
      margin-bottom: 18px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      line-height: 1.3;
    }
    .meta {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      color: #475569;
      font-size: 14px;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 0 0 18px;
    }
    button {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #1e293b;
      border-radius: 8px;
      padding: 9px 14px;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    button.primary {
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }
    button:hover { filter: brightness(0.97); }
    .diagram-wrap {
      background: #ffffff;
      border: 1px solid #dbe3ef;
      border-radius: 10px;
      padding: 28px;
      overflow: auto;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }
    #diagram {
      min-width: 1180px;
      display: flex;
      justify-content: center;
    }
    #diagram svg {
      max-width: 100%;
      height: auto;
    }
    .note {
      margin-top: 18px;
      background: #ffffff;
      border: 1px solid #dbe3ef;
      border-radius: 10px;
      padding: 18px 22px;
      color: #334155;
      line-height: 1.75;
      font-size: 14px;
    }
    @media print {
      body { background: #ffffff; padding: 0; }
      header, .toolbar, .note { display: none; }
      .diagram-wrap { border: none; box-shadow: none; padding: 0; }
      #diagram { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>轮罩法规校核功能流程图</h1>
      <div class="meta">
        <span>项目: wheel_trim</span>
        <span>流程: 轮罩/车轮装配上传到法规报告输出</span>
        <span>格式: Mermaid Flowchart</span>
      </div>
    </header>

    <div class="toolbar">
      <button class="primary" onclick="downloadSVG()">下载 SVG</button>
      <button onclick="downloadPNG()">下载 PNG</button>
      <button onclick="window.print()">导出 PDF</button>
    </div>

    <main class="diagram-wrap">
      <div id="diagram"></div>
    </main>

    <section class="note">
      该流程图按当前真实实现整理，覆盖本地 Web 工作台、FastAPI 服务端、独立 Worker、CATIA COM 自动化、Tire 候选识别、轮罩匹配、法规轴线截面、q/c/p/p30 测量、标注截图和报告输出。
    </section>
  </div>

  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: "base",
      themeVariables: {
        background: "#ffffff",
        primaryColor: "#f8fafc",
        primaryTextColor: "#0f172a",
        primaryBorderColor: "#cbd5e1",
        lineColor: "#64748b",
        fontFamily: "Microsoft YaHei, PingFang SC, Arial, sans-serif",
        fontSize: "14px"
      },
      flowchart: {
        useMaxWidth: true,
        htmlLabels: true,
        curve: "basis",
        padding: 12
      },
      securityLevel: "loose"
    });

    const diagram = String.raw`flowchart TD
  Start([开始])
  End([完成])
  Fail([流程终止])

  subgraph UI["本地 Web 工作台"]
    direction TB
    U1[打开浏览器工作台]
    U2[检测 CATIA 状态]
    U3{CATIA 已打开?}
    U4[点击打开 CATIA]
    U5{启动或连接成功?}
    U6[选择 1-4 个轮罩 CATPart]
    U7[选择车轮装配文件夹]
    U8[指定根 CATProduct]
    U9[填写轮胎半径 r 和宽度 b]
    U10{输入类型和参数正确?}
    U11[提交 /verify]
    U12[WebSocket 展示 11 步状态与日志]
    U13[下载结果或保存到版本库]
  end

  subgraph Server["FastAPI 服务端"]
    direction TB
    S1[接收轮罩文件/装配文件/参数]
    S2{校核流程正在运行?}
    S3[校验 CATPart 和 CATProduct]
    S4[保存上传文件到 uploads]
    S5[定位车轮根装配文件]
    S6[启动独立 Worker 子进程]
    S7[接收 Worker JSON 结果]
    S8[生成 Word 法规报告]
    S9{总成/过程/报告产物存在?}
    S10[返回下载链接与状态]
    S11[记录错误并推送失败日志]
  end

  subgraph Worker["CATIA Worker 与算法"]
    direction TB
    W1[初始化 COM 并连接 CATIA]
    W2[打开轮罩和车轮装配输入]
    W3[创建校核 CATProduct 总成]
    W4[过滤隐藏零件]
    W5[筛选 Tire 候选件]
    W6{找到可用 Tire?}
    W7[测量轮罩和零件重心]
    W8[按 400mm 近邻筛选]
    W9[匹配轮罩与 Tire]
    W10{至少一个轮罩匹配成功?}
    W11[创建法规轴线段]
    W12[创建 0deg/30deg 截面平面]
    W13[测量轮罩包围盒 q]
    W14[导出截面曲线 CATPart]
    W15[提取截面极值点]
    W16[计算 p 和 p30]
    W17[测量轮罩到 Tire 轴线距离 c]
    W18[按 q>b/c<2r/p>30 判定]
    W19[创建法规标注]
    W20[截取 q/c/p/p30 截图]
    W21[隐藏当前标注并继续下一项]
    W22[恢复最终显示状态]
    W23[保存校核总成/过程 Part/JSON]
  end

  subgraph Output["结果交付"]
    direction TB
    O1[校核 CATProduct]
    O2[过程 CATPart]
    O3[标注 CATPart]
    O4[截图 PNG]
    O5[结果 JSON]
    O6[Word 报告]
  end

  Start --> U1 --> U2 --> U3
  U3 -- 是 --> U6
  U3 -- 否 --> U4 --> U5
  U5 -- 否 --> S11 --> Fail
  U5 -- 是 --> U6

  U6 --> U7 --> U8 --> U9 --> U10
  U10 -- 否 --> S11 --> Fail
  U10 -- 是 --> U11 --> S1
  U12 -.实时日志.-> S6

  S1 --> S2
  S2 -- 是 --> S11 --> Fail
  S2 -- 否 --> S3
  S3 --> S4 --> S5 --> S6 --> W1

  W1 --> W2 --> W3 --> W4 --> W5 --> W6
  W6 -- 否 --> S11 --> Fail
  W6 -- 是 --> W7 --> W8 --> W9 --> W10
  W10 -- 否 --> S11 --> Fail
  W10 -- 是 --> W11 --> W12 --> W13 --> W14 --> W15 --> W16 --> W17 --> W18 --> W19 --> W20 --> W21
  W21 --> W22 --> W23 --> S7

  W23 --> O1
  W23 --> O2
  W19 --> O3
  W20 --> O4
  W23 --> O5
  S8 --> O6

  S7 --> S8 --> S9
  S9 -- 否 --> S11 --> Fail
  S9 -- 是 --> S10 --> U13 --> End

  classDef startEnd fill:#DCFCE7,stroke:#16A34A,stroke-width:1.5px,color:#14532D
  classDef fail fill:#FEE2E2,stroke:#DC2626,stroke-width:1.5px,color:#7F1D1D
  classDef ui fill:#DBEAFE,stroke:#2563EB,stroke-width:1.3px,color:#1E3A8A
  classDef server fill:#CCFBF1,stroke:#0D9488,stroke-width:1.3px,color:#134E4A
  classDef worker fill:#FCE7F3,stroke:#DB2777,stroke-width:1.3px,color:#831843
  classDef output fill:#F1F5F9,stroke:#64748B,stroke-width:1.3px,color:#334155
  classDef decision fill:#FEF3C7,stroke:#D97706,stroke-width:1.5px,color:#78350F

  class Start,End startEnd
  class Fail fail
  class U1,U2,U4,U6,U7,U8,U9,U11,U12,U13 ui
  class S1,S3,S4,S5,S6,S7,S8,S10,S11 server
  class W1,W2,W3,W4,W5,W7,W8,W9,W11,W12,W13,W14,W15,W16,W17,W18,W19,W20,W21,W22,W23 worker
  class O1,O2,O3,O4,O5,O6 output
  class U3,U5,U10,S2,S9,W6,W10 decision`;

    async function renderDiagram() {
      try {
        const result = await mermaid.render("wheelhouse-flowchart", diagram);
        document.getElementById("diagram").innerHTML = result.svg;
      } catch (error) {
        document.getElementById("diagram").innerHTML = "<p style='color:#dc2626'>流程图渲染失败: " + error.message + "</p>";
      }
    }

    function getSVGElement() {
      return document.querySelector("#diagram svg");
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      document.body.removeChild(anchor);
      URL.revokeObjectURL(url);
    }

    function downloadSVG() {
      const svg = getSVGElement();
      if (!svg) return;
      const clone = svg.cloneNode(true);
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      downloadBlob(
        new Blob(['<?xml version="1.0" encoding="UTF-8"?>', clone.outerHTML], { type: "image/svg+xml" }),
        "轮罩法规校核功能流程图.svg"
      );
    }

    function downloadPNG() {
      const svg = getSVGElement();
      if (!svg) return;
      const clone = svg.cloneNode(true);
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      const serialized = new XMLSerializer().serializeToString(clone);
      const bounds = svg.getBoundingClientRect();
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.ceil(bounds.width * 2));
      canvas.height = Math.max(1, Math.ceil(bounds.height * 2));
      const ctx = canvas.getContext("2d");
      ctx.scale(2, 2);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const image = new Image();
      const url = URL.createObjectURL(new Blob(['<?xml version="1.0" encoding="UTF-8"?>', serialized], { type: "image/svg+xml" }));
      image.onload = function () {
        ctx.drawImage(image, 0, 0);
        URL.revokeObjectURL(url);
        canvas.toBlob(function (blob) {
          if (blob) downloadBlob(blob, "轮罩法规校核功能流程图.png");
        });
      };
      image.src = url;
    }

    renderDiagram();
  </script>
</body>
</html>
